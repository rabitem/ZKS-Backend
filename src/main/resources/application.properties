# general configuration
server.port=8080

# datasource configuration
spring.datasource.url=${ZKS_DATABASE_URL:jdbc:mariadb://127.0.0.1:3306/zks}
spring.datasource.username=${ZKS_DATABASE_USER:zks}
spring.datasource.password=${ZKS_DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate

# actuator configuration
management.endpoints.enabled-by-default=false
management.endpoint.info.enabled=true
management.endpoint.health.enabled=true
management.endpoint.health.show-details=always
management.endpoint.db.enabled=true
